<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PayPal ResolveAI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--navy:#003087;--blue:#0070E0;--deep:#001C64;--lb:#EAF3FF;--bg:#FFFFFF;--card:#fff;--tx:#142C4E;--mu:#5d6f8a;--bd:#e1e7f0;--ok:#0070E0;--wa:#4a98ea;--er:#003087;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:15px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{margin:0 0 .4em;line-height:1.15;letter-spacing:-.02em}h1{font-size:clamp(34px,6vw,58px);font-weight:800}h2{font-size:26px}h3{font-size:16px}p{margin:.3em 0}
a{color:var(--blue);cursor:pointer;text-decoration:none}.mu{color:var(--mu);font-size:13px}
button,.btn{font:600 14px Inter,sans-serif;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;background:var(--blue);color:#fff;transition:.15s}button:hover{filter:brightness(1.1)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.g{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}.sm{padding:6px 14px;font-size:13px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}.err{color:var(--er);font-size:12px;min-height:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,48,135,.06)}
.grid{display:grid;gap:16px}.c4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.c3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.nav{display:flex;align-items:center;gap:22px;padding:14px 5vw;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;flex-wrap:wrap}.nav a{color:var(--tx);font-weight:500}.sp{flex:1}
.logo{font-weight:800;font-size:20px;color:var(--navy);display:flex;gap:8px;align-items:center}.logo img{width:34px;height:34px;display:block}.side .logo img{background:#fff;border-radius:9px;padding:3px}
.hero{background:linear-gradient(160deg,var(--deep),var(--navy) 55%,var(--blue));color:#fff;padding:70px 5vw}.hero .in{max-width:1150px;margin:auto;display:grid;gap:40px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:center}.hero p{font-size:18px;opacity:.9}.hero .g{color:#fff;border-color:#fff}.hero .card{color:var(--tx)}
.sec{padding:56px 5vw;max-width:1250px;margin:auto}.band{background:var(--lb)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s0{background:#EAF3FF;color:#0070E0}.s1{background:#d6e8ff;color:#003087}.s2{background:#fff;color:#003087;border:1.5px solid #0070E0}.s3{background:#b8d6fa;color:#001C64}.s4{background:#0070E0;color:#fff}.s5{background:#003087;color:#fff}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--deep);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.side .logo{color:#fff;margin:0 8px 18px}.side a{display:flex;justify-content:space-between;color:#cfe0ff;padding:10px 12px;border-radius:10px;font-weight:500}.side a.on,.side a:hover{background:rgba(255,255,255,.14);color:#fff}
.main{padding:24px 4vw;min-width:0}.top{display:flex;gap:12px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.bur{display:none;padding:8px 12px}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:-260px;width:250px;z-index:40;transition:.2s}.side.open{left:0}.bur{display:inline-block}}
.num{font-size:30px;font-weight:800;color:var(--navy)}.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:14px}.tbl th{color:var(--mu);font-weight:600;font-size:12px}.sc{overflow-x:auto}
.tl{border-left:3px solid var(--lb);margin-left:6px;padding-left:16px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.bar{height:8px;border-radius:9px;background:var(--lb);overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--ok));transition:width .5s}
.fact{border-left:4px solid var(--ok);background:var(--card)}.ai{border-left:4px solid var(--wa)}.tag{font-size:11px;font-weight:700;color:var(--mu)}
.chat{height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px}.m{max-width:80%;padding:10px 14px;border-radius:14px;background:var(--lb)}.m.u{align-self:flex-end;background:var(--blue);color:#fff}
.chip{background:var(--lb);color:var(--navy);border-radius:99px;padding:6px 12px;font-size:13px;margin:3px;display:inline-block;cursor:pointer}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.drop{border:2px dashed var(--blue);border-radius:14px;padding:26px;text-align:center;background:var(--lb);cursor:pointer}.steps{display:flex;gap:6px;margin-bottom:16px}.steps span{flex:1;height:6px;border-radius:9px;background:var(--bd)}.steps .d{background:var(--blue)}
.cat{padding:14px;border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;margin-bottom:8px;font-weight:600}.cat.on{border-color:var(--blue);background:var(--lb)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block;margin-right:6px}.dot.r{background:var(--bd)}

const NAV=[['overview','Overview'],['disputes','My Disputes'],['new','Create New Case'],['evidence','Evidence Center'],['assistant','AI Assistant'],['analytics','Resolution Analytics'],['notifications','Notifications'],['settings','Settings']];
function lineChart(v,l){const W=420,H=150,m=Math.max(...v)+1,p=v.map((y,i)=>[20+i*(W-40)/(v.length-1),H-20-y/m*(H-40)]);return `<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#0070E0" stroke-width="3" points="${p.map(x=>x.join(',')).join(' ')}"/>${p.map((x,i)=>`<circle cx="${x[0]}" cy="${x[1]}" r="4" fill="#003087"/><text x="${x[0]}" y="${H-4}" font-size="11" text-anchor="middle" fill="#5d6f8a">${l[i]}</text><text x="${x[0]}" y="${x[1]-9}" font-size="11" text-anchor="middle" fill="#142C4E">${v[i]}</text>`).join('')}</svg>`}
function bars(items){const m=Math.max(...items.map(i=>i[1]),1);return items.map(i=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${i[0]}</span><b>${i[1]}</b></div><div class="bar"><b style="width:${i[1]/m*100}%"></b></div></div>`).join('')}

let CH=[['a','Hi, I can help with payment disputes. Pick a question or type your own.']];
const QS=['Why is my payment being disputed?','What evidence should I provide?','How can I respond to this claim?','What does my current case status mean?'];
function assistant(){return shell('assistant',`<div class="card" style="max-width:760px"><div class="chat" id="ch">${CH.map(m=>`<div class="m ${m[0]=='u'?'u':''}">${m[1]}</div>`).join('')}</div><div>${QS.map(q=>`<span class="chip" onclick="ask('${q}')">${q}</span>`).join('')}</div><div style="display:flex;gap:6px;margin-top:8px"><input id="ci" placeholder="Ask about a dispute" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">Send</button></div><p class="mu">Simulated assistant based on your case records. It does not state payment policies.</p></div>`,'AI Assistant')}
function ask(q){q=q||ci.value;if(!q.trim())return;const c=S.cases.find(x=>x.st<4)||S.cases[0];CH.push(['u',q]);render();ch.scrollTop=1e9;const l=q.toLowerCase();let r;
if(l.includes('evidence'))r=`For ${c.id} (${c.cat}) the expected items are ${REQ[c.cat].join(', ')}. Still missing: <b>${miss(c).join(', ')||'nothing'}</b>.`;
else if(l.includes('status'))r=`${c.id} is <b>${ST[c.st]}</b>. This is the stage recorded on the case; check the case page for any required action.`;
else if(l.includes('respond')||l.includes('claim'))r=`Keep it factual: state the transaction (${c.tx}), what happened in order, and attach your evidence. I can draft this for you on the case page; you approve it before anything is sent.`;
else r=`On ${c.id}, the dispute is filed as <b>${c.cat}</b> for ${money(c.amt,c.cur)}. The reason comes from the complaint: "${c.desc}"`;
setTimeout(()=>{CH.push(['a','<span class="mu">Typing…</span>']);render();ch.scrollTop=1e9;setTimeout(()=>{CH[CH.length-1]=['a',r+'<br><span class="mu">AI suggestion, not verified.</span>'];render();ch.scrollTop=1e9},900)},200)}
function analytics(){const C=S.cases,r=C.filter(c=>c.st>=4);return shell('analytics',`<div class="grid c4">${[['Total disputes',C.length],['Resolution rate',Math.round(r.length/C.length*100)+'%'],['Avg resolution time','11 days'],['Evidence completion',Math.round(C.reduce((a,c)=>a+comp(c),0)/C.length)+'%']].map(x=>`<div class="card"><span class="mu">${x[0]}</span><div class="num">${x[1]}</div></div>`).join('')}</div><div class="grid c2" style="margin-top:16px"><div class="card"><h3>Category distribution</h3>${bars(CATS.map(k=>[k,C.filter(c=>c.cat==k).length]))}</div><div class="card"><h3>Monthly trends</h3>${lineChart(mc(),months)}</div><div class="card"><h3>Status distribution</h3>${bars(ST.map((s,i)=>[s,C.filter(c=>c.st==i).length]))}</div></div><p class="mu">Average resolution time is an illustrative demo figure.</p>`,'Resolution Analytics')}
function notifications(){return shell('notifications',`<div class="card" style="max-width:760px"><p><button class="sm g" onclick="S.notifs.forEach(n=>n.r=1);save();render()">Mark all read</button></p>${S.notifs.map(n=>`<p style="border-top:1px solid var(--bd);padding-top:10px;${n.r?'opacity:.6':''}"><span class="pill s0">${n.k}</span> ${n.r?'':'<span class="dot"></span>'}<br><a onclick="go('case-${n.c}')">${n.t}</a> <span class="mu">· ${n.d}</span></p>`).join('')}</div>`,'Notifications')}
function settings(){return shell('settings',`<div class="grid c2"><div class="card"><h3>Profile</h3><label>Name</label><input id="sn" value="${S.name}"><label>Email</label><input id="se" value="${S.email}"><label>Role</label><select id="sr">${['Buyer','Seller','Freelancer','Merchant'].map(r=>`<option ${S.role==r?'selected':''}>${r}</option>`).join('')}</select><p><button onclick="S.name=sn.value;S.email=se.value;S.role=sr.value;save();toast('Profile saved');render()">Save changes</button></p></div><div class="card"><h3>Notification preferences</h3>${[['email','Email updates'],['push','Push alerts'],['deadline','Deadline reminders']].map(p=>`<label style="display:flex;gap:8px;font-weight:500"><input type="checkbox" style="width:auto" ${S.prefs[p[0]]?'checked':''} onchange="S.prefs.${p[0]}=this.checked;save();toast('Preference saved')">${p[1]}</label>`).join('')}<h3 style="margin-top:18px">Security</h3><p class="mu">Two-step verification: off</p><button class="g sm" onclick="toast('Password reset link sent')">Change password</button><h3 style="margin-top:18px">Role information</h3><p class="mu">${S.role}s can file disputes, upload evidence and respond to claims. <a onclick="localStorage.removeItem('rai');location.reload()">Reset demo data</a></p></div></div>`,'Settings')}
function render(){let h=(location.hash||'#home').slice(1),H;const priv=['overview','disputes','new','evidence','assistant','analytics','notifications','settings'];
if((priv.includes(h)||h.startsWith('case-'))&&!S.user){h='signin'}
if(h=='home')H=landing();else if(['signin','signup','forgot'].includes(h))H=auth(h);else if(h.startsWith('case-'))H=caseP(h.slice(5));else H=({overview,disputes,new:newc,evidence,assistant,analytics,notifications,settings}[h]||landing)();
const sy=scrollY,f=document.activeElement&&document.activeElement.id,v=f&&document.activeElement.value;$('#root').innerHTML=H;if(h=='disputes')dl();if(h=='evidence')el(EC||S.cases[0].id);if(f&&$('#'+f)&&['cm','ci','sn','se','es','q'].includes(f)){$('#'+f).value=v;$('#'+f).focus()}if(h=='assistant')ch.scrollTop=1e9;scrollTo(0,sy)}
addEventListener('hashchange',()=>{scrollTo(0,0);render()});render();
</script></body></html>
